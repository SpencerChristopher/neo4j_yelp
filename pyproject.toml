[project]
name = "yelp-graph-analyzer"
version = "0.1.0"
description = "Yelp recommendation engine using Neo4j"
authors = [
    {name = "Christopher Spencer ",email = "121028147+SpencerChristopher@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "pydantic (>=2.5.3,<3.0.0)",
    "neo4j (>=5.17.0,<6.0.0)",
    "tqdm (>=4.66.1,<5.0.0)",
    "scikit-learn (>=1.3.2,<2.0.0)",
    "collections-extended (>=1.0.0,<2.0.0)",
    "matplotlib (>=3.8.2,<4.0.0)",
    "seaborn (>=0.13.0,<1.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
notebook = "^7.5.2"
pytest = "^9.0.2" # Added for testing

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config" # Recommended best practices

pytest = "^9.0.2"
