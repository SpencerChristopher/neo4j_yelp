version: '3.8'

services:
  neo4j:
    image: neo4j:5.18.0
    hostname: neo4j
    ports:
      - "7474:7474" # Neo4j Browser/HTTP
      - "7687:7687" # Bolt protocol
    environment:
      # Set up initial password for neo4j user. Values are sourced from .env file.
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}

      # APOC Configuration (Note: Settings are case-sensitive)
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"

      # Install APOC and Graph Data Science plugins
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'

      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_heap_initial__size: "1G"

      # Security: You must also unrestricted these procedures to use the plugins fully
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"

    volumes:
      - ./Data:/var/lib/neo4j/import # Removed :ro to allow container write access during startup
      - neo4j-data:/data # Persistent storage for Neo4j data
      - ./neo4j/logs:/logs # Optional: for easier log access
    restart: unless-stopped # Keep Neo4j running unless manually stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    # Removed depends_on: neo4j: condition: service_healthy due to dependency cycle

volumes:
  neo4j-data: # Named volume for persistent Neo4j data