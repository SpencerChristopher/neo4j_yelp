version: '3.8'

services:
  neo4j:
    image: neo4j:5.18.0
    hostname: neo4j
    ports:
      - "7474:7474" # Neo4j Browser/HTTP
      - "7687:7687" # Bolt protocol
    environment:
      # Set up initial password for neo4j user
      NEO4J_AUTH: neo4j/password
      # Enable APOC plugin for various utilities
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      # Install APOC and Graph Data Science plugins
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      # Enable database discovery (useful for client connections)
      NEO4J_db_discovery_enabled: "true"
      # JVM options (optional, adjust based on available memory)
      NEO4J_dbms_memory_heap_max__size: "1G"
      NEO4J_dbms_memory_heap_initial__size: "512M"
    volumes:
      - neo4j-data:/data
      - ./neo4j/logs:/logs # Optional: for easier log access
      - ./neo4j/import:/var/lib/neo4j/import # Optional: for data import, mounted to current directory
    restart: unless-stopped # Keep Neo4j running unless manually stopped

volumes:
  neo4j-data: # Named volume for persistent Neo4j data
