version: '3.8'

services:
  neo4j:
    image: neo4j:5.18.0
    hostname: neo4j
    ports:
      - "7474:7474" # Neo4j Browser/HTTP
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'

      # FIX: Corrected transaction timeout setting for Neo4j 5.x
      NEO4J_db_transaction_timeout: "60s"

      # Correct memory namespaces for Neo4j 5.x
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_heap_initial__size: "1G"

      # APOC settings
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"

      # Security permissions
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"


    volumes:
      - ./Data:/var/lib/neo4j/import # Must be writable for the container's startup script
      - neo4j-data:/data # Persistent storage for Neo4j data
      - ./neo4j/logs:/logs # Optional: for easier log access
    restart: unless-stopped # Keep Neo4j running unless manually stopped
    # Removed depends_on: neo4j: condition: service_healthy due to dependency cycle

volumes:
  neo4j-data: # Named volume for persistent Neo4j data
